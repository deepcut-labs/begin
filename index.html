<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepcut Labs</title>
  <meta name="description" content="Deepcut Labs, LLC">
  <style>
    :root {
      --bg: #fafaf8;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --rule: #e2e2de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --fg: #ededea;
        --muted: #9a9a96;
        --rule: #2a2a2e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    main {
      max-width: 34rem;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p.tagline {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 1.1rem;
    }
    footer {
      margin-top: 4rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.85rem;
      width: 100%;
      max-width: 34rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Deepcut Labs</h1>
    <p class="tagline">Something new is taking shape.</p>
  </main>
  <footer>
    &copy; 2026 Deepcut Labs, LLC
  </footer>
</body>
</html>
